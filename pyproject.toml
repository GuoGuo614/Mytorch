[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelleaf"
version = "0.1.0"
description = "KernelLeaf: a small TensorOp-based deep learning framework for teaching"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GuoGuo614"}]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
cuda = [
    "cupy-cuda12x>=13",
    "nvidia-cuda-runtime-cu12>=12,<13",
    "nvidia-cuda-nvrtc-cu12>=12,<13",
]
triton = [
    "triton>=3.2; platform_system == 'Linux'",
    "triton-windows>=3.2; platform_system == 'Windows'",
]
dashboard = ["fastapi>=0.110", "uvicorn>=0.27"]
autodrive = ["Pillow>=9"]
simulator = ["gym>=0.26", "gym-donkeycar"]
collection = ["pygame>=2", "Pillow>=9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kernelleaf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
